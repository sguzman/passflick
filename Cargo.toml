[package]
name = "passflick"
version = "0.1.0"
edition = "2024"
description = "A fast read-only password projection for Linux"
repository = "https://github.com/sguzman/passflick"
license = "MIT"

[dependencies]
argon2 = "0.6"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
csv = "1.3"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
getrandom = "0.4"
libc = "0.2"
linux-keyutils = { version = "0.2.5", features = ["std"] }
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secret-service = { version = "5.2", default-features = false, features = ["rt-async-io-crypto-rust"] }
thiserror = "2.0"
zeroize = { version = "1.9", features = ["serde"] }

[dev-dependencies]
# Isolated native HTTPS sync prototype; not included in release picker yet.
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
# Reviewed MIT Rust cipherstring/KDF primitives, test-only until proven with Vaultwarden.
rbw = { version = "=1.15.0", default-features = false }
# Test-only RFC 6238 TOTP verification against a disposable account.
data-encoding = "=2.11.1"
hmac = "=0.12.1"
sha1 = "=0.10.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
