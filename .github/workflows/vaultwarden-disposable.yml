name: Disposable Vaultwarden acceptance

on:
  push:
    branches: [main]
    paths:
      - 'src/bitwarden/**'
      - 'src/projection.rs'
      - 'src/copy_shortcut.rs'
      - 'src/app.rs'
      - 'src/main.rs'
      - 'src/clipboard.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/vaultwarden-disposable.sh'
      - 'ci/wayland-populated-smoke.sh'
      - '.github/workflows/vaultwarden-disposable.yml'
  workflow_dispatch:

concurrency:
  group: passflick-disposable-vaultwarden
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - name: Install Rust desktop build prerequisites
        # Pin the tested LTS runner: 26.04's large media dependency tree and
        # slow archive mirror have exceeded the bounded apt install window.
        # Do not install optional desktop recommends; the actual Weston,
        # pinned wl-clipboard, and disposable Vaultwarden gates still run.
        # Bound package-mirror stalls separately from integration tests.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev openssl curl xvfb xauth xdotool libgl1-mesa-dri libxkbcommon-x11-0 weston wl-clipboard libegl1 meson ninja-build wayland-protocols
      - name: Checkout pinned wl-clipboard 2.3.0 for native Wayland secret handling
        uses: actions/checkout@v7
        with:
          repository: bugaevc/wl-clipboard
          ref: 67a7b937895bceec1ae5ccebb10216f63f70ca1b
          path: .ci-wl-clipboard
          persist-credentials: false
      - name: Build sensitive-capable native Wayland clipboard helper
        run: |
          meson setup .ci-wl-build .ci-wl-clipboard --buildtype=release
          meson compile -C .ci-wl-build
          ./.ci-wl-build/src/wl-copy --help | grep -q -- '--sensitive'
          echo "${GITHUB_WORKSPACE}/.ci-wl-build/src" >> "${GITHUB_PATH}"
      - name: Test real disposable Vaultwarden over trusted HTTPS
        run: bash ci/vaultwarden-disposable.sh
