name: Rust
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'desktop/**'
      - 'scripts/install-user.sh'
      - 'ci/desktop-smoke.sh'
      - 'ci/recovery-smoke.py'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'desktop/**'
      - 'scripts/install-user.sh'
      - 'ci/desktop-smoke.sh'
      - 'ci/recovery-smoke.py'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - name: Install Linux windowing development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev desktop-file-utils
      - name: Check committed formatting
        run: cargo fmt --all -- --check
      - name: Standalone desktop installation smoke test
        run: bash ci/desktop-smoke.sh
      - name: Test
        run: cargo test --locked --all-targets
      - name: CLI smoke checks
        run: |
          cargo run --locked --quiet -- --help | grep -F 'Shift+Enter'
          cargo run --locked --quiet -- --version
      - name: Synthetic encrypted recovery smoke test
        run: |
          python3 ci/recovery-smoke.py --self-test
          cargo build --locked
          python3 ci/recovery-smoke.py target/debug/passflick
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

