name: Rust
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - name: Install Linux windowing development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - name: Check committed formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --all-targets
      - name: CLI smoke checks
        run: |
          cargo run --locked --quiet -- --help | grep -F 'Shift+Enter'
          cargo run --locked --quiet -- --version
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

