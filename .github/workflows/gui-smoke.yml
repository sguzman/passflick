name: Synthetic GUI
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/gui-smoke.sh'
      - '.github/workflows/gui-smoke.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/gui-smoke.sh'
      - '.github/workflows/gui-smoke.yml'
  workflow_dispatch:

concurrency:
  group: gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install X11, software rendering and virtual display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev xvfb xauth xdotool libgl1-mesa-dri libxkbcommon-x11-0
      - name: Compile real debug picker from locked dependency set
        run: cargo build --locked
      - name: Exercise picker with synthetic account data only
        run: xvfb-run -a bash ci/gui-smoke.sh
